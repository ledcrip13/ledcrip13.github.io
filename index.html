<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,orientation=landscape">
<title>саламалекум брэтиш</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" onload="console.log('PeerJS loaded');"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:rgb(0,0,0);touch-action:none;user-select:none;font-family:monospace;}
canvas{display:block;width:100%;height:100%;pointer-events:none;}
div.hud{position:fixed;inset:0;pointer-events:none;}
div.cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;}
div.cross::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.85);transform:translateY(-50%);}
div.cross::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,0.85);transform:translateX(-50%);}
div.cross-dot{position:absolute;width:2px;height:2px;background:rgba(255,255,255,0.9);top:50%;left:50%;transform:translate(-50%,-50%);}
div.ammo-box{position:absolute;bottom:80px;right:18px;text-align:right;display:flex;align-items:baseline;gap:4px;}
span.ammo-cur{font-size:36px;color:rgb(255,255,255);font-weight:bold;line-height:1;}
span.ammo-sep{font-size:14px;color:rgba(255,255,255,0.25);}
span.ammo-res{font-size:14px;color:rgba(255,255,255,0.35);}
div.hp-box{position:absolute;bottom:80px;left:18px;}
div.hp-bar{width:100px;height:4px;background:rgba(255,255,255,0.08);}
div.hp-fill{height:100%;background:rgba(255,255,255,0.7);transition:width 0.15s;}
div.msg-box{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:16px;color:rgba(255,255,200,0.9);letter-spacing:3px;text-align:center;}
div.hit-m{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;opacity:0;transition:opacity 0.06s;}
div.hit-m::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgb(255,60,60);transform:translateY(-50%);}
div.hit-m::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgb(255,60,60);transform:translateX(-50%);}
div.dmg-flash{position:fixed;inset:0;background:rgba(255,0,0,0.28);opacity:0;pointer-events:none;transition:opacity 0.1s;}
div.low-vig{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(220,0,0,0.5) 100%);pointer-events:none;animation:pvig 1.3s ease-in-out infinite;}
@keyframes pvig{0%,100%{opacity:0;}50%{opacity:1;}}
div.reload-wrap{position:absolute;bottom:68px;right:18px;width:80px;height:2px;background:rgba(255,255,255,0.08);opacity:0;transition:opacity 0.15s;}
div.reload-fill{height:100%;width:0%;background:rgba(255,200,0,0.8);transition:width linear;}
div.roundover{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;}
div.ro-title{font-size:28px;letter-spacing:8px;margin-bottom:10px;}
div.ro-next{font-size:11px;color:rgba(0,200,255,0.8);letter-spacing:4px;animation:blink 0.9s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.1;}}
div.joy-wrap{position:fixed;bottom:22px;left:22px;width:120px;height:120px;pointer-events:all;z-index:50;}
div.joy-base{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);}
div.joy-knob{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);top:50%;left:50%;transform:translate(-50%,-50%);}
div.look-area{position:fixed;inset:0 160px 0 162px;z-index:40;pointer-events:all;}
div.btns{position:fixed;bottom:22px;right:18px;z-index:50;pointer-events:all;display:flex;flex-direction:column;align-items:center;gap:10px;}
div.btn-fire{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;transition:background 0.07s;}
div.btn-fire:active{background:rgba(255,255,255,0.18);}
div.btn-fire svg{width:22px;height:22px;}
div.btn-jump{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;transition:background 0.07s;}
div.btn-jump:active{background:rgba(255,255,255,0.14);}
div.btn-jump svg{width:16px;height:16px;}
div.orient-lock{position:fixed;inset:0;background:rgb(0,0,0);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;}
div.orient-lock span{color:rgba(255,255,255,0.5);font-size:12px;letter-spacing:2px;}
div.orient-lock svg{width:48px;height:48px;}
div.main-menu{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgb(8,8,8);gap:0;pointer-events:all;}
div.mm-logo{font-size:52px;font-weight:900;color:rgb(255,255,255);letter-spacing:2px;margin-bottom:6px;line-height:1;}
div.mm-tag{font-size:11px;color:rgba(255,255,255,0.2);margin-bottom:52px;letter-spacing:1px;}
div.mm-item{width:180px;padding:14px 0;text-align:center;font-size:15px;color:rgba(255,255,255,0.55);cursor:pointer;position:relative;margin:2px 0;transition:color 0.15s;}
div.mm-item::after{content:"";position:absolute;bottom:0;left:20%;width:60%;height:1px;background:rgba(255,255,255,0.08);}
div.mm-item:hover,div.mm-item:active{color:rgba(255,255,255,0.95);}
div.online-panel{position:fixed;inset:0;z-index:501;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgb(8,8,8);gap:0;pointer-events:all;}
div.op-head{font-size:13px;color:rgba(255,255,255,0.3);margin-bottom:40px;letter-spacing:2px;}
div.op-item{width:180px;padding:14px 0;text-align:center;font-size:15px;color:rgba(255,255,255,0.55);cursor:pointer;position:relative;margin:2px 0;transition:color 0.15s;pointer-events:all;z-index:503;user-select:none;-webkit-user-select:none;}
div.op-item::after{content:"";position:absolute;bottom:0;left:20%;width:60%;height:1px;background:rgba(255,255,255,0.08);}
div.op-item:hover,div.op-item:active{color:rgba(255,255,255,0.95);}
div.op-back-btn{margin-top:40px;font-size:12px;color:rgba(255,255,255,0.2);cursor:pointer;padding:10px;}
div.op-back-btn:active{color:rgba(255,255,255,0.6);}
div.lobby-panel{position:fixed;inset:0;z-index:502;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgb(8,8,8);gap:14px;pointer-events:all;}
div.lp-label{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:2px;}
div.lp-code-box{font-size:38px;color:rgb(255,255,255);font-weight:bold;letter-spacing:10px;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:6px;}
div.lp-hint{font-size:11px;color:rgba(255,255,255,0.25);max-width:220px;text-align:center;line-height:1.6;}
div.lp-wait{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;}
input.lp-inp{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.25);color:rgb(255,255,255);font-size:28px;letter-spacing:8px;padding:8px 0;text-align:center;width:200px;font-family:monospace;text-transform:uppercase;outline:none;display:none;}
div.lp-go{margin-top:8px;font-size:14px;color:rgba(255,255,255,0.5);cursor:pointer;padding:12px 32px;border:1px solid rgba(255,255,255,0.15);display:none;transition:color 0.1s,border-color 0.1s;}
div.lp-go:active{color:rgb(255,255,255);border-color:rgba(255,255,255,0.5);}
div.lp-cancel{margin-top:24px;font-size:11px;color:rgba(255,255,255,0.2);cursor:pointer;padding:8px;}
div.lp-cancel:active{color:rgba(255,255,255,0.5);}
div.peer-hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:2px;pointer-events:none;z-index:10;}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div class="hud">
  <div class="cross"><div class="cross-dot"></div></div>
  <div class="ammo-box">
    <span class="ammo-cur" id="aCur">30</span>
    <span class="ammo-sep">/</span>
    <span class="ammo-res" id="aRes">90</span>
  </div>
  <div class="hp-box">
    <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
  </div>
  <div class="kills-box" id="killsBox" style="position:absolute;top:18px;right:18px;font-size:14px;color:rgba(255,255,255,0.6);letter-spacing:1px;">KILLS: <span id="killCount">0</span></div>
  <div class="msg-box" id="msgBox"></div>
  <div class="hit-m" id="hitM"></div>
  <div class="reload-wrap" id="rwrap"><div class="reload-fill" id="rfill"></div></div>
</div>
<div class="dmg-flash" id="dmgFlash"></div>
<div class="low-vig" id="lowVig" style="display:none"></div>
<div class="roundover" id="roScreen">
  <div class="ro-title" id="roTitle">ROUND OVER</div>
  <div class="ro-next">NEXT ROUND STARTING...</div>
</div>
<div class="joy-wrap" id="joyWrap">
  <div class="joy-base"></div>
  <div class="joy-knob" id="joyKnob"></div>
</div>
<div class="look-area" id="lookArea"></div>
<div class="pause-btn" id="pauseBtn" style="position:fixed;top:12px;right:12px;width:36px;height:36px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:all;">
  <div style="width:6px;height:20px;background:rgba(255,255,255,0.8);margin:0 3px;"></div>
  <div style="width:6px;height:20px;background:rgba(255,255,255,0.8);margin:0 3px;"></div>
</div>
<div class="pause-menu" id="pauseMenu" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:600;gap:20px;">
  <div style="font-size:24px;color:rgba(255,255,255,0.9);letter-spacing:2px;">ПАУЗА</div>
  <div class="pause-opt" id="pauseResume" style="width:160px;padding:12px;text-align:center;font-size:14px;color:rgba(255,255,255,0.6);cursor:pointer;border:1px solid rgba(255,255,255,0.2);transition:color 0.15s;">ВОЗОБНОВИТЬ</div>
  <div class="pause-opt" id="pauseMenu2" style="width:160px;padding:12px;text-align:center;font-size:14px;color:rgba(255,255,255,0.6);cursor:pointer;border:1px solid rgba(255,255,255,0.2);transition:color 0.15s;">МЕНЮ</div>
</div>
<div class="btns">
  <div class="btn-fire" id="btnFire">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="4" fill="rgba(0,0,0,0.9)"/>
      <circle cx="12" cy="12" r="9" stroke="rgba(0,0,0,0.7)" stroke-width="1.5" fill="none"/>
      <line x1="12" y1="2" x2="12" y2="6" stroke="rgba(0,0,0,0.8)" stroke-width="1.5"/>
      <line x1="12" y1="18" x2="12" y2="22" stroke="rgba(0,0,0,0.8)" stroke-width="1.5"/>
      <line x1="2" y1="12" x2="6" y2="12" stroke="rgba(0,0,0,0.8)" stroke-width="1.5"/>
      <line x1="18" y1="12" x2="22" y2="12" stroke="rgba(0,0,0,0.8)" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="btn-jump" id="btnJump">
    <svg viewBox="0 0 16 16" fill="none">
      <polyline points="2,11 8,4 14,11" stroke="rgba(0,0,0,0.85)" stroke-width="2" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
</div>
<div class="orient-lock" id="orientLock">
  <svg viewBox="0 0 48 48" fill="none">
    <rect x="8" y="14" width="32" height="20" rx="3" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="2.5" fill="rgba(255,255,255,0.35)"/>
  </svg>
  <span>переверни телефон</span>
</div>

<div class="main-menu" id="mainMenu" style="display:none"></div>

<div class="peer-hud" id="peerHud" style="position:fixed;bottom:20px;left:20px;color:rgba(255,255,255,0.5);font-size:12px;"></div>

<script>
(function(){
"use strict";
console.log("SCRIPT STARTED");

function checkOrient(){
  var ol=document.getElementById("orientLock");
  if(!ol) return;
  if(window.innerWidth<window.innerHeight){ol.style.display="flex";}
  else{ol.style.display="none";}
}
window.addEventListener("resize",checkOrient);
checkOrient();

var canvas=document.getElementById("gc");
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=false;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x556680);
scene.fog=new THREE.Fog(0x556680,22,60);
var camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.05,200);
camera.position.set(0,1.7,0);
window.addEventListener("resize",function(){
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  checkOrient();
});
var clock=new THREE.Clock();

var AK={dmg:36,rate:0.1,reload:2.5,mag:30,res:90,spread:0.03,recoil:0.04};
var player={
  hp:100,pos:new THREE.Vector3(0,0,0),vel:new THREE.Vector3(0,0,0),
  onGround:true,yaw:0,pitch:0,speed:5,ammo:30,reserve:90,kills:0,radius:0.4
};
var input={mx:0,my:0};
var firing={ok:true,ft:0,reloading:false,rt:0};
var bots=[],decals=[],lvlMeshes=[],wallSegs=[];
var mflash=null,mt=0,recoilR=0,wobT=0,wobX=0,wobY=0;

function buildLevel(){
  var fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x6a6a5a}));
  fl.rotation.x=-Math.PI/2;scene.add(fl);
  var ce=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x4a4a4a}));
  ce.rotation.x=Math.PI/2;ce.position.y=4;scene.add(ce);

  function box(px,py,pz,sx,sy,sz,col){
    var m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshLambertMaterial({color:col}));
    m.position.set(px,py,pz);
    scene.add(m);
    lvlMeshes.push(m);
    wallSegs.push({x:px,z:pz,hw:sx/2,hd:sz/2,minY:py-sy/2,maxY:py+sy/2});
  }
  box(0,2,-25,60,4,1,0x7a7a70);
  box(0,2,25,60,4,1,0x7a7a70);
  box(-30,2,0,1,4,50,0x7a7a70);
  box(30,2,0,1,4,50,0x7a7a70);
  box(0,1.5,-10,6,3,1,0x6e6e62);
  box(0,1.5,10,6,3,1,0x6e6e62);
  box(-10,1.5,0,1,3,6,0x6e6e62);
  box(10,1.5,0,1,3,6,0x6e6e62);
  box(-15,1,-5,3,2,1,0x666660);
  box(15,1,5,3,2,1,0x666660);
  box(-8,0.5,-18,4,1,3,0x5c5c54);
  box(8,0.5,18,4,1,3,0x5c5c54);
  box(0,0.5,0,3,1,3,0x70705a);
  box(-20,1.5,15,1,3,4,0x6a6a5e);
  box(20,1.5,-15,1,3,4,0x6a6a5e);
  box(-5,0.5,15,2,1,2,0x666660);
  box(5,0.5,-15,2,1,2,0x666660);

  scene.add(new THREE.AmbientLight(0xffeedd,0.65));
  var dl=new THREE.DirectionalLight(0xfff5e0,1.2);dl.position.set(8,18,6);scene.add(dl);
  var dl2=new THREE.DirectionalLight(0x8899aa,0.5);dl2.position.set(-10,5,-8);scene.add(dl2);
}

function resolveCircleAABB(pos,radius){
  for(var i=0;i<wallSegs.length;i++){
    var w=wallSegs[i];
    var ex=Math.max(0,Math.abs(pos.x-w.x)-(w.hw+radius));
    var ez=Math.max(0,Math.abs(pos.z-w.z)-(w.hd+radius));
    if(ex===0&&ez===0){
      var ox=w.hw+radius-Math.abs(pos.x-w.x);
      var oz=w.hd+radius-Math.abs(pos.z-w.z);
      if(ox<oz){pos.x+=ox*(pos.x<w.x?-1:1);}
      else{pos.z+=oz*(pos.z<w.z?-1:1);}
    }
  }
}

function buildWeapon(){
  var g=new THREE.Group();
  var bk=new THREE.MeshLambertMaterial({color:0x1a1a1a});
  var dk=new THREE.MeshLambertMaterial({color:0x0e0e0e});
  var br=new THREE.MeshLambertMaterial({color:0x5c3010});
  var skin=new THREE.MeshLambertMaterial({color:0xb07848});
  var sleeve=new THREE.MeshLambertMaterial({color:0x2a3e2a});

  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.06,0.07,0.38),bk));
  var bar=new THREE.Mesh(new THREE.BoxGeometry(0.022,0.022,0.22),dk);
  bar.position.set(0,0.015,-0.29);g.add(bar);
  var grp=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.11,0.05),br);
  grp.position.set(0,-0.085,0.07);grp.rotation.x=0.18;g.add(grp);
  var mag=new THREE.Mesh(new THREE.BoxGeometry(0.038,0.1,0.04),dk);
  mag.position.set(0,-0.09,0.0);mag.rotation.x=0.1;g.add(mag);
  var stk=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.05,0.18),br);
  stk.position.set(0,-0.01,0.22);g.add(stk);

  var armR=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.28),sleeve);
  armR.position.set(0.06,-0.14,-0.04);g.add(armR);
  var handR=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.08,0.12),skin);
  handR.position.set(0.06,-0.14,-0.19);g.add(handR);

  var armL=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.2),sleeve);
  armL.position.set(-0.08,-0.14,-0.16);g.add(armL);
  var handL=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.07,0.1),skin);
  handL.position.set(-0.06,-0.14,-0.25);g.add(handL);

  g.position.set(0.18,-0.15,-0.36);
  camera.add(g);scene.add(camera);
  mflash=new THREE.PointLight(0xff8800,0,2);
  mflash.position.set(0.18,-0.12,-0.58);camera.add(mflash);
  return g;
}
var weaponModel=buildWeapon();

function dealDamageToPlayer(dmg){
  player.hp=Math.max(0,player.hp-dmg);
  var fl=document.getElementById("dmgFlash");
  if(fl){fl.style.opacity="1";setTimeout(function(){fl.style.opacity="0";},130);}
  updHpUI();
  if(player.hp<=0){sendPeer({type:"dead"});playerDead();}
}

function playerDead(){
  showMsg("YOU DIED",2000);
  player.hp=0;
  setTimeout(function(){
    player.hp=100;
    player.ammo=AK.mag;
    player.reserve=AK.res;
    player.pos.set(0,0,0);
    player.yaw=0;
    player.pitch=0;
    updHpUI();
    updAmmoUI();
  },2000);
}

function shoot(){
  if(firing.reloading)return;
  if(player.ammo<=0){startReload();return;}
  if(!firing.ok)return;
  firing.ok=false;firing.ft=AK.rate;
  player.ammo--;updAmmoUI();
  var dir=new THREE.Vector3((Math.random()-0.5)*AK.spread,(Math.random()-0.5)*AK.spread,-1).normalize();
  dir.applyQuaternion(camera.quaternion);
  var ray=new THREE.Raycaster(camera.position.clone(),dir,0,100);
  if(gameMode==="online"){
    Object.keys(remoteMeshes).forEach(function(pid){
      var rm=remoteMeshes[pid];
      var hits=ray.intersectObjects([rm],true);
      if(hits.length>0){
        showMsg("HIT",500);
        var hel2=document.getElementById("hitM");
        if(hel2){hel2.style.opacity="1";setTimeout(function(){if(hel2)hel2.style.opacity="0";},110);}
        if(peers[pid]&&peers[pid].open)peers[pid].send({type:"shoot"});
      }
    });
  }
  var bms=bots.filter(function(b){return b.alive;}).map(function(b){return b.mesh;});
  var bh=ray.intersectObjects(bms,true);
  if(bh.length>0){
    var hm=bh[0].object;while(hm.parent&&hm.parent!==scene)hm=hm.parent;
    var hb=bots.find(function(b){return b.mesh===hm;});
    if(hb&&hb.alive){
      var isH=bh[0].object===hb.mesh.children[1];
      hb.hp-=AK.dmg*(isH?2.5:1);
      var hel=document.getElementById("hitM");
      if(hel){hel.style.opacity="1";
      setTimeout(function(){if(hel)hel.style.opacity="0";},110);}
      if(hb.hp<=0){
        rmBot(hb);player.kills++;
        updAmmoUI();
        showMsg(isH?"HEADSHOT":"KILL",700);
        var alive=bots.filter(function(b){return b.alive;}).length;
        if(alive===0)setTimeout(function(){endRound(true);},900);
      }
    }
  }
  var wh=ray.intersectObjects(lvlMeshes);
  if(wh.length>0){
    var dm=new THREE.Mesh(new THREE.PlaneGeometry(0.13,0.13),new THREE.MeshBasicMaterial({color:0x1a1a1a,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1}));
    dm.setRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),wh[0].face.normal));
    dm.position.copy(wh[0].point).addScaledVector(wh[0].face.normal,0.01);
    scene.add(dm);decals.push(dm);
    if(decals.length>50)scene.remove(decals.shift());
  }
  player.pitch+=AK.recoil;recoilR=0;
  mflash.intensity=3.5;mt=0.05;
}

function startReload(){
  if(firing.reloading||player.ammo>=AK.mag||player.reserve<=0)return;
  firing.reloading=true;firing.rt=AK.reload;
  var w=document.getElementById("rwrap"),f=document.getElementById("rfill");
  w.style.opacity="1";f.style.transition="none";f.style.width="0%";
  setTimeout(function(){f.style.transition="width "+AK.reload+"s linear";f.style.width="100%";},18);
  setTimeout(function(){w.style.opacity="0";f.style.width="0%";},AK.reload*1000+80);
}
function finishReload(){
  firing.reloading=false;
  var need=AK.mag-player.ammo,take=Math.min(need,player.reserve);
  player.ammo+=take;player.reserve-=take;updAmmoUI();
}

function setupConn(conn){
  var pid=conn.peer;
  peers[pid]=conn;
  conn.on("data",function(d){onData(pid,d);});
  conn.on("close",function(){removePeer(pid);});
  conn.on("error",function(){removePeer(pid);});
}
function removePeer(pid){
  delete peers[pid];
  if(remoteMeshes[pid]){scene.remove(remoteMeshes[pid]);delete remoteMeshes[pid];}
  document.getElementById("peerHud").textContent="игроков: "+Object.keys(peers).length;
}
function sendPeer(obj){
  Object.values(peers).forEach(function(c){if(c&&c.open)c.send(obj);});
}
function onData(pid,d){
  if(d.type==="pos"){
    if(!remoteMeshes[pid])remoteMeshes[pid]=mkRemoteMesh(new THREE.Vector3(d.x,0,d.z));
    remoteMeshes[pid].position.set(d.x,0,d.z);
    remoteMeshes[pid].rotation.y=d.yaw+Math.PI;
  }else if(d.type==="shoot"){
    dealDamageToPlayer(AK.dmg);
  }else if(d.type==="dead"){
    showMsg("враг убит",1200);
    if(remoteMeshes[pid]){scene.remove(remoteMeshes[pid]);delete remoteMeshes[pid];}
  }else if(d.type==="peers"){
    d.ids.forEach(function(id){
      if(id!==peer.id&&!peers[id]){
        var c=peer.connect(id,{serialization:"json"});
        c.on("open",function(){setupConn(c);});
        c.on("error",function(){});
      }
    });
  }
}

// Сначала пробуем стать хостом с фиксированным ID
peer=new Peer(ROOM,{debug:0});
peer.on("open",function(){
  isHost=true;
  document.getElementById("peerHud").textContent="хост";
});
peer.on("connection",function(conn){
  conn.on("open",function(){
    setupConn(conn);
    // Отправляем новому игроку список всех остальных
    var ids=Object.keys(peers).filter(function(id){return id!==conn.peer;});
    ids.push(peer.id);
    conn.send({type:"peers",ids:ids});
    document.getElementById("peerHud").textContent="хост / "+Object.keys(peers).length+" игр";
  });
});
peer.on("error",function(err){
  if(err.type==="unavailable-id"){
    // Хост уже есть — подключаемся как клиент
    peer=new Peer(undefined,{debug:0});
    peer.on("open",function(){
      document.getElementById("peerHud").textContent="подключение...";
      var h=peer.connect(ROOM,{serialization:"json"});
      h.on("open",function(){
        setupConn(h);
        document.getElementById("peerHud").textContent="в игре";
      });
      h.on("error",function(){
        document.getElementById("peerHud").textContent="ошибка";
      });
    });
    peer.on("connection",function(conn){
      conn.on("open",function(){setupConn(conn);});
    });
    peer.on("error",function(){});
  }
});

function mkRemoteMesh(pos){
  var root=new THREE.Group();root.position.copy(pos);

  var dk=new THREE.MeshLambertMaterial({color:0x2a1010});
  var hm2=new THREE.MeshLambertMaterial({color:0x281818});
  var lm=new THREE.MeshLambertMaterial({color:0x1e1010});
  var bk=new THREE.MeshLambertMaterial({color:0x111111});
  var tr=new THREE.Mesh(new THREE.BoxGeometry(0.58,0.7,0.3),bm);tr.position.y=1.25;root.add(tr);
  var h=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.36,0.34),sk);h.position.y=1.78;root.add(h);
  var he=new THREE.Mesh(new THREE.BoxGeometry(0.39,0.18,0.37),hm2);he.position.y=1.97;root.add(he);
  var aL=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.6,0.18),bm);aL.position.set(0.42,1.18,0);root.add(aL);
  var aR=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.6,0.18),bm);aR.position.set(-0.42,1.18,0);root.add(aR);
  var w=new THREE.Mesh(new THREE.BoxGeometry(0.54,0.22,0.28),dk);w.position.y=0.88;root.add(w);
  var lL=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.56,0.22),lm);lL.position.set(0.16,0.5,0);root.add(lL);
  var lR=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.56,0.22),lm);lR.position.set(-0.16,0.5,0);root.add(lR);
  var bL=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.18,0.26),bk);bL.position.set(0.16,0.18,0.02);root.add(bL);
  var bR=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.18,0.26),bk);bR.position.set(-0.16,0.18,0.02);root.add(bR);
  
  // Оружие в руках онлайн игрока
  var gunG=new THREE.Group();
  gunG.position.set(-0.42,0.88,0.05);
  var gunBk=new THREE.MeshLambertMaterial({color:0x1a1a1a});
  var gunDk=new THREE.MeshLambertMaterial({color:0x0e0e0e});
  var gunBr=new THREE.MeshLambertMaterial({color:0x5c3010});
  gunG.add(new THREE.Mesh(new THREE.BoxGeometry(0.05,0.06,0.3),gunBk));
  var bar=new THREE.Mesh(new THREE.BoxGeometry(0.018,0.018,0.18),gunDk);
  bar.position.set(0,0.01,-0.22);gunG.add(bar);
  var grp=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.09,0.05),gunBr);
  grp.position.set(0,-0.07,0.08);grp.rotation.x=0.2;gunG.add(grp);
  var mag=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.08,0.035),gunDk);
  mag.position.set(0,-0.07,0);mag.rotation.x=0.1;gunG.add(mag);
  root.add(gunG);
  
  scene.add(root);return root;
}

function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05);
  
  if(isPaused){renderer.render(scene,camera);return;}

  if(keys["KeyW"]||keys["ArrowUp"])input.my=-1;
  else if(keys["KeyS"]||keys["ArrowDown"])input.my=1;
  else if(!joyActive)input.my=0;
  if(keys["KeyA"]||keys["ArrowLeft"])input.mx=-1;
  else if(keys["KeyD"]||keys["ArrowRight"])input.mx=1;
  else if(!joyActive)input.mx=0;

  var md=new THREE.Vector3(input.mx,0,input.my);
  if(md.length()>1)md.normalize();
  md.applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);

  player.pos.x+=md.x*player.speed*dt;
  player.pos.z+=md.z*player.speed*dt;
  player.vel.y-=18*dt;
  player.pos.y+=player.vel.y*dt;
  if(player.pos.y<=0){player.pos.y=0;player.vel.y=0;player.onGround=true;}

  resolveCircleAABB(player.pos,player.radius);

  camera.position.set(player.pos.x,player.pos.y+1.7,player.pos.z);
  camera.quaternion.setFromEuler(new THREE.Euler(player.pitch,player.yaw,0,"YXZ"));

  if(recoilR>0){recoilR-=dt;}

  var mov=md.length()>0.01;
  if(mov){wobT+=dt*10;wobX=Math.sin(wobT)*0.007;wobY=Math.abs(Math.cos(wobT))*0.004;}
  else{wobX*=0.85;wobY*=0.85;}
  weaponModel.position.set(0.18+wobX,-0.15-wobY,-0.36);

  if(firing.ft>0){firing.ft-=dt;if(firing.ft<=0)firing.ok=true;}
  if(firing.reloading){firing.rt-=dt;if(firing.rt<=0)finishReload();}
  if(shootHeld&&firing.ok&&!firing.reloading)shoot();
  if(mt>0){mt-=dt;if(mt<=0)mflash.intensity=0;}

  if(gameMode==="online"){
    netTimer+=dt;
    if(netTimer>0.05){
      netTimer=0;
      sendPeer({type:"pos",x:player.pos.x,z:player.pos.z,yaw:player.yaw});
    }
  }

  renderer.render(scene,camera);
}
loop();
